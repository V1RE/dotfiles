#:schema https://pitchfork.jdx.dev/schema.json

[settings.general]
mise = true
# The boot supervisor runs under launchd with PATH=/usr/bin:/bin:/usr/sbin:/sbin
mise_bin = "/Users/niels/.local/bin/mise"

[daemons.tlo]
run = "exec ~/.local/bin/mise exec npm:@2digits/tlo-mcp -- tlo-mcp --port 4790"
dir = "~/"
boot_start = true
# Restart forever: tlo-mcp exits with an error when the OpenTunnel connection drops.
retry = true
# Only "ready" once the tunnel is up (first certificate can take a few minutes).
ready_output = { pattern = "TLO gateway ready:", timeout = "5m" }
# Kill (and thus restart) the gateway when its local HTTP server stops answering.
health_port = { port = 4790, interval = "30s", retries = 3 }
stop_signal = { signal = "SIGINT", timeout = "10s" }

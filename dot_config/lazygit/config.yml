gui:
  nerdFontsVersion: "3"
  mouseEvents: false
  showFileTree: true
  scrollHeight: 5
  expandFocusedSidePanel: false
git:
  localBranchSortOrder: recency
  diffRenderers:
    - colorArg: always
      type: rawGit
    # - pager: delta --dark --paging=never
    - command: critique --stdin
  overrideGpg: true
  log:
    showWholeGraph: true
    showGraph: always
quitOnTopLevelReturn: false
os:
  editPreset: nvim

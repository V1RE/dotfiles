#:schema https://mise.jdx.dev/schema/mise.json

[plugins]
vite-plus = "https://github.com/markmals/mise-vite-plus"

[tools]
"cargo:worktrunk" = "latest"
"npm:@fsouza/prettierd" = "latest"
"npm:neovim" = "latest"
"npm:opensrc" = "latest"
"npm:skills" = "latest"
"npm:trash-cli" = "latest"
"npm:tsrs" = "latest"
bun = "latest"
claude = "latest"
lazygit = "latest"
node = "latest"
pi = "latest"
vercel = { version = "latest", allow_builds = ["esbuild"], trust_policy_excludes = ["undici"] }
vite-plus = "latest"

[tools."github:googleworkspace/cli"]
version = "latest"
lazy = true
lazy_bins = ["gws"]

[tools."aqua:atuinsh/atuin"]
version = "latest"
postinstall = { run = "atuin gen-completions --shell zsh > {{ env.HOME }}/.zsh/_atuin", when = "always" }

[tools."aqua:pnpm/pnpm"]
version = "latest"
postinstall.run = "pnpm completion zsh > {{ env.HOME }}/.zsh/_pnpm"
postinstall.when = "always"

[tools."github:nubjs/nub"]
version = "latest"
depends = ["usage"]
postinstall = { run = "usage generate completion zsh nub --file {{ env.HOME }}/.zsh/completions/nub.usage.kdl > {{ env.HOME }}/.zsh/_nub", when = "always" }

[tools."npm:calldiff"]
version = "latest"
lazy = true
lazy_bins = ["calldiff"]
postinstall = { run = "calldiff completions zsh > {{ env.HOME }}/.zsh/_calldiff", when = "always" }

[tools."npm:cf"]
version = "latest"
postinstall = { run = "cf complete zsh > {{ env.HOME }}/.zsh/_cf", when = "always" }

[tools."npm:eas-cli"]
version = "latest"
lazy = true
lazy_bins = ["eas"]
# Only refresh the completion cache; .zshrc adds its functions dir to fpath.
# `eas autocomplete:script` would emit a setup that runs a second compinit.
postinstall = { run = "eas autocomplete zsh --refresh-cache", when = "always" }

[tools."npm:fallow"]
version = "latest"
depends = ["usage"]
postinstall = { run = "usage generate completion zsh fallow --file {{ env.HOME }}/.zsh/completions/fallow.usage.kdl > {{ env.HOME }}/.zsh/_fallow", when = "always" }

[tools."npm:wrangler"]
version = "latest"
lazy = true
lazy_bins = ["wrangler", "wrangler2"]
postinstall = { run = "wrangler complete zsh > {{ env.HOME }}/.zsh/_wrangler", when = "always" }

[tools."npm:zele"]
version = "latest"
postinstall = { run = "zele completions script --shell zsh > {{ env.HOME }}/.zsh/_zele", when = "always" }

[tools.codex]
version = "latest"
postinstall = { run = "codex completion zsh > {{ env.HOME }}/.zsh/_codex", when = "always" }

[tools.graphite]
version = "latest"
postinstall = { run = "gt completion > {{ env.HOME }}/.zsh/_gt", when = "always" }

[tools.hcloud]
version = "latest"
postinstall = { run = "hcloud completion zsh > {{ env.HOME }}/.zsh/_hcloud", when = "always" }

[tools.hunk]
version = "latest"
postinstall = { run = "hunk completion zsh > {{ env.HOME }}/.zsh/_hunk", when = "always" }

[tools.java]
version = "latest"
lazy = true

[tools.mr-boxington]
version = "latest"
workflow = "release.yml@refs/heads/main"
postinstall = { run = "mbx completion zsh > {{ env.HOME }}/.zsh/_mbx", when = "always" }

[tools.pitchfork]
version = "latest"
postinstall = { run = "pitchfork completion zsh > {{ env.HOME }}/.zsh/_pitchfork", when = "always" }
workflow = "release.yml@refs/heads/main"

[tools.rust]
version = "latest"
mr_boxington = true
postinstall = { run = "rustup completions zsh > {{ env.HOME }}/.zsh/_rustup && rustup completions zsh cargo > {{ env.HOME }}/.zsh/_cargo", when = "always" }

[tools.television]
version = "latest"
postinstall = { run = "tv completions zsh > {{ env.HOME }}/.zsh/_tv", when = "always" }

[tools.usage]
version = "latest"
postinstall = { run = "usage --completions zsh > {{ env.HOME }}/.zsh/_usage", when = "always" }

[tools.uv]
version = "latest"
postinstall = { run = "uv generate-shell-completion zsh > {{ env.HOME }}/.zsh/_uv && uvx --generate-shell-completion zsh > {{ env.HOME }}/.zsh/_uvx", when = "always" }

[tools.watchexec]
version = "latest"
postinstall = { run = "watchexec --completions zsh > {{ env.HOME }}/.zsh/_watchexec", when = "always" }

[tools.opencode]
allow_builds = ["@opencode/cli"]
postinstall = { run = "opencode --completions zsh > {{ env.HOME }}/.zsh/_opencode", when = "always" }
version = "latest"

[tools.amp]
allow_builds = ["@ampcode/cli"]
postinstall = { run = "amp completions zsh > {{ env.HOME }}/.zsh/_amp", when = "always" }
prerelease = "true"
version = "latest"

[tools.aube]
postinstall = { run = "aube completion zsh > {{ env.HOME }}/.zsh/_aube", when = "always" }
version = "latest"
workflow = ["release-plz.yml@refs/heads/main", "release.yml@refs/heads/main"]

[tools.oh-my-pi]
postinstall = { run = "omp completions zsh > {{ env.HOME }}/.zsh/_omp", when = "always" }
rename_exe = "omp"
version = "latest"

[tools.herdr]
postinstall = { run = "herdr completion zsh > {{ env.HOME }}/.zsh/_herdr", when = "always" }
version = "latest"

[settings]
pin = false
color_theme = "catppuccin"
experimental = true
idiomatic_version_file_enable_tools = ["node"]
minimum_release_age = "0s"
trusted_config_paths = ["{{ env.HOME }}/Code/"]
fetch_remote_versions_cache = "5m"
self_update = { auto = true, check_duration = "8h" }

[settings.npm]
package_manager = "aube"

[settings.cargo]
binstall = true
binstall_quickinstall = true
binstall_native = true

[settings.pipx]
uvx = true

# Resolve GitHub tokens via gh CLI (macOS Keychain) so mise doesn't hit unauthenticated rate limits.
[settings.github]
credential_command = 'gh auth token --hostname "$MISE_CREDENTIAL_HOST"'

[bootstrap.user]
login_shell = "/bin/zsh"

[bootstrap.mise_shell_activate]
zprofile = "shims"
zshrc = "activate"
bash_profile = "shims"
bashrc = "activate"
fish = "activate"

[env]
"_".path = "~/bin"
AUBE_PREFER_SYMLINKED_EXECUTABLES = "true"
OPENCODE_ENABLE_EXA = "1"
OPENCODE_EXPERIMENTAL = "0"
OPENCODE_EXPERIMENTAL_MARKDOWN = "1"
OPENCODE_EXPERIMENTAL_FILEWATCHER = "1"
OPENCODE_EXPERIMENTAL_SCOUT = "1"
OPENCODE_ENABLE_EXPERIMENTAL_MODELS = "1"
OPENCODE_EXPERIMENTAL_CUSTOMIZE_SKILL = "1"
OPENCODE_EXPERIMENTAL_WORKSPACES = "1"
OPENCODE_EXPERIMENTAL_BACKGROUND_SUBAGENTS = "1"
OPENCODE_EXPERIMENTAL_NATIVE_LLM = "1"
OPENCODE_ENABLE_PARALLEL = "1"

HOMEBREW_NO_ASK = "1"

CLAUDE_CODE_NO_FLICKER = true

OPT_OUT_INSTRUMENTATION = true

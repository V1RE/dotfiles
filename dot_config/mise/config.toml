#:schema https://mise.jdx.dev/schema/mise.json

[plugins]
vite-plus = "https://github.com/markmals/mise-vite-plus"

[tools]
"cargo:worktrunk" = "latest"
"github:googleworkspace/cli" = "latest"
"npm:@fsouza/prettierd" = "latest"
"npm:agent-browser" = "latest"
"npm:calldiff" = "latest"
"npm:eas-cli" = "latest"
"npm:fallow" = "latest"
"npm:knip" = "latest"
"npm:neovim" = "latest"
"npm:opensrc" = "latest"
"npm:skills" = "latest"
"npm:taze" = "latest"
"npm:trash-cli" = "latest"
"npm:turbo" = "latest"
"npm:wrangler" = "latest"
"npm:zele" = "latest"
bun = "latest"
codex = "latest"
graphite = "latest"
hcloud = "latest"
java = "latest"
lazygit = "latest"
node = "24"
nub = "latest"
pi = "latest"
pitchfork = "latest"
pnpm = "latest"
television = "latest"
usage = "latest"
uv = "latest"
vercel = "latest"
vite-plus = "latest"
hunk = "latest"

[tools.aube]
version = "latest"
postinstall = "aube completion zsh > {{ env.HOME }}/.zsh/_aube"

[tools."npm:@opencode-ai/cli"]
version = "beta"
allow_builds = ["@opencode-ai/cli"]
postinstall = "opencode2 --completions zsh > {{ env.HOME }}/.zsh/_opencode2"

[tools.oh-my-pi]
version = "latest"
rename_exe = "omp"
postinstall = "omp completions zsh > {{ env.HOME }}/.zsh/_omp"

[tools.herdr]
version = "latest"
postinstall = "herdr completion zsh > {{ env.HOME }}/.zsh/_herdr"

[settings]
color_theme = "catppuccin"
experimental = true
idiomatic_version_file_enable_tools = ["node"]
minimum_release_age = "0"
trusted_config_paths = ["{{ env.HOME }}/Code/"]
auto_update = true
fetch_remote_versions_cache = "5m"

[settings.npm]
package_manager = "aube"

[settings.cargo]
binstall = true
binstall_quickinstall = true
binstall_native = true

[settings.pipx]
uvx = true

[bootstrap.packages]
"brew-cask:1password" = "latest"
"brew-cask:mos" = "latest"
"brew-cask:ghostty@tip" = "latest"
"brew-cask:whatsapp@beta" = "latest"

# "brew:mas" = "latest"
# "mas:497799835" = "latest"       # Xcode

[bootstrap.user]
login_shell = "/bin/zsh"

[bootstrap.mise_shell_activate]
zprofile = "shims"
zshrc = "activate"
bash_profile = "shims"
bashrc = "activate"
fish = "activate"

[bootstrap.macos.dock]
autohide = true
orientation = "bottom"
show_recents = false
magnification = true
mru_spaces = false

# Dock sizes are stored as floats by macOS; the friendly fields only accept integers.
[bootstrap.macos.defaults."com.apple.dock"]
tilesize = 48.0
largesize = 65.0

[bootstrap.macos.keyboard]
key_repeat = 2
initial_key_repeat = 15
press_and_hold = false

[env]
"_".path = "~/bin"
AUBE_PREFER_SYMLINKED_EXECUTABLES = "true"
OPENCODE_ENABLE_EXA = "1"
OPENCODE_EXPERIMENTAL = "0"
OPENCODE_EXPERIMENTAL_MARKDOWN = "1"
OPENCODE_EXPERIMENTAL_FILEWATCHER = "1"
OPENCODE_EXPERIMENTAL_SCOUT = "1"
OPENCODE_ENABLE_EXPERIMENTAL_MODELS = "1"
OPENCODE_EXPERIMENTAL_CUSTOMIZE_SKILL = "1"
OPENCODE_EXPERIMENTAL_WORKSPACES = "1"
OPENCODE_EXPERIMENTAL_BACKGROUND_SUBAGENTS = "1"
OPENCODE_EXPERIMENTAL_NATIVE_LLM = "1"
OPENCODE_ENABLE_PARALLEL = "1"

HOMEBREW_NO_ASK = "1"

CLAUDE_CODE_NO_FLICKER = true

OPT_OUT_INSTRUMENTATION = true

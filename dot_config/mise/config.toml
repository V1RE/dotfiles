#:schema https://mise.jdx.dev/schema/mise.json

[plugins]
vite-plus = "https://github.com/markmals/mise-vite-plus"

[tools]
"aqua:atuinsh/atuin" = { version = "latest", postinstall = "atuin gen-completions --shell zsh > {{ env.HOME }}/.zsh/_atuin" }
"aqua:pnpm/pnpm" = { version = "latest", postinstall = "pnpm completion zsh > {{ env.HOME }}/.zsh/_pnpm" }
"cargo:worktrunk" = "latest"
"github:googleworkspace/cli" = "latest"
"github:nubjs/nub" = { version = "latest", depends = ["usage"], postinstall = "usage generate completion zsh nub --file {{ env.HOME }}/.zsh/completions/nub.usage.kdl > {{ env.HOME }}/.zsh/_nub" }
"npm:@fsouza/prettierd" = "latest"
"npm:calldiff" = { version = "latest", lazy = true, lazy_bins = ["calldiff"], postinstall = "calldiff completions zsh > {{ env.HOME }}/.zsh/_calldiff" }
"npm:cf" = { version = "latest", postinstall = "cf complete zsh > {{ env.HOME }}/.zsh/_cf" }
"npm:eas-cli" = { version = "latest", lazy = true, lazy_bins = ["eas"], postinstall = "eas autocomplete zsh --refresh-cache && eas autocomplete:script zsh > {{ env.HOME }}/.zsh/eas.zsh" }
"npm:fallow" = { version = "latest", depends = ["usage"], postinstall = "usage generate completion zsh fallow --file {{ env.HOME }}/.zsh/completions/fallow.usage.kdl > {{ env.HOME }}/.zsh/_fallow" }
"npm:neovim" = "latest"
"npm:opensrc" = "latest"
"npm:skills" = "latest"
"npm:trash-cli" = "latest"
"npm:wrangler" = { version = "latest", lazy = true, lazy_bins = ["wrangler", "wrangler2"], postinstall = "wrangler complete zsh > {{ env.HOME }}/.zsh/_wrangler" }
"npm:zele" = { version = "latest", postinstall = "zele completions script --shell zsh > {{ env.HOME }}/.zsh/_zele" }
bun = "latest"
claude = "latest"
codex = { version = "latest", postinstall = "codex completion zsh > {{ env.HOME }}/.zsh/_codex" }
graphite = { version = "latest", postinstall = "gt completion > {{ env.HOME }}/.zsh/_gt" }
hcloud = { version = "latest", postinstall = "hcloud completion zsh > {{ env.HOME }}/.zsh/_hcloud" }
hunk = { version = "latest", postinstall = "hunk completion zsh > {{ env.HOME }}/.zsh/_hunk" }
java = { version = "latest", lazy = true }
lazygit = "latest"
mr-boxington = { version = "latest", workflow = "release.yml@refs/heads/main", postinstall = "mbx completion zsh > {{ env.HOME }}/.zsh/_mbx" }
node = "24"
pi = "latest"
pitchfork = { version = "latest", postinstall = "pitchfork completion zsh > {{ env.HOME }}/.zsh/_pitchfork" }
rust = { version = "latest", mr_boxington = true, postinstall = "rustup completions zsh > {{ env.HOME }}/.zsh/_rustup && rustup completions zsh cargo > {{ env.HOME }}/.zsh/_cargo" }
television = { version = "latest", postinstall = "tv completions zsh > {{ env.HOME }}/.zsh/_tv" }
usage = { version = "latest", postinstall = "usage --completions zsh > {{ env.HOME }}/.zsh/_usage" }
uv = { version = "latest", postinstall = "uv generate-shell-completion zsh > {{ env.HOME }}/.zsh/_uv && uvx --generate-shell-completion zsh > {{ env.HOME }}/.zsh/_uvx" }
vercel = "latest"
vite-plus = "latest"
watchexec = { version = "latest", postinstall = "watchexec --completions zsh > {{ env.HOME }}/.zsh/_watchexec" }

[tools.amp]
allow_builds = ["@ampcode/cli"]
postinstall = "amp completions zsh > {{ env.HOME }}/.zsh/_amp"
prerelease = true
version = "latest"

[tools.aube]
postinstall = "aube completion zsh > {{ env.HOME }}/.zsh/_aube"
version = "latest"

[tools.oh-my-pi]
postinstall = "omp completions zsh > {{ env.HOME }}/.zsh/_omp"
rename_exe = "omp"
version = "latest"

[tools.herdr]
postinstall = "herdr completion zsh > {{ env.HOME }}/.zsh/_herdr"
version = "latest"

[settings]
color_theme = "catppuccin"
experimental = true
idiomatic_version_file_enable_tools = ["node"]
minimum_release_age = "0s"
trusted_config_paths = ["{{ env.HOME }}/Code/"]
fetch_remote_versions_cache = "5m"
self_update = { auto = true, check_duration = "8h" }

[settings.npm]
package_manager = "aube"

[settings.cargo]
binstall = true
binstall_quickinstall = true
binstall_native = true

[settings.pipx]
uvx = true

# Resolve GitHub tokens via gh CLI (macOS Keychain) so mise doesn't hit unauthenticated rate limits.
[settings.github]
credential_command = 'gh auth token --hostname "$MISE_CREDENTIAL_HOST"'

[bootstrap.user]
login_shell = "/bin/zsh"

[bootstrap.mise_shell_activate]
zprofile = "shims"
zshrc = "activate"
bash_profile = "shims"
bashrc = "activate"
fish = "activate"

[env]
"_".path = "~/bin"
AUBE_PREFER_SYMLINKED_EXECUTABLES = "true"
OPENCODE_ENABLE_EXA = "1"
OPENCODE_EXPERIMENTAL = "0"
OPENCODE_EXPERIMENTAL_MARKDOWN = "1"
OPENCODE_EXPERIMENTAL_FILEWATCHER = "1"
OPENCODE_EXPERIMENTAL_SCOUT = "1"
OPENCODE_ENABLE_EXPERIMENTAL_MODELS = "1"
OPENCODE_EXPERIMENTAL_CUSTOMIZE_SKILL = "1"
OPENCODE_EXPERIMENTAL_WORKSPACES = "1"
OPENCODE_EXPERIMENTAL_BACKGROUND_SUBAGENTS = "1"
OPENCODE_EXPERIMENTAL_NATIVE_LLM = "1"
OPENCODE_ENABLE_PARALLEL = "1"

HOMEBREW_NO_ASK = "1"

CLAUDE_CODE_NO_FLICKER = true

OPT_OUT_INSTRUMENTATION = true
